<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans antialised">

    <!-- --NAVBAR-- -->
    <nav class="bg-blue-500 p-5 text-white flex justify-between">
        <h1 class="text-2xl font-bold">AI BLOG GENERATOR</h1>
        <div>
            <a href="login" class="hover:underline font-bold">login |</a>
            <a href="signup" class="hover:underline font-bold">Signup</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
     <div class="flex item-center justify-center h-screen mx-auto mt-10 px-4 sm:px-0">
        <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full" >

            <!-- LOGIN FORM -->
             <form class="space-y-4" action="", method="POST">
                {% csrf_token %}

                {% if error_message%}

                <div class="text-center text-red-400">
                    <h2>
                        {{error_message}}
                    </h2>
                </div>
                {% endif %}

                <h2 class="text-xl font-semibold">Login</h2>
                <div>
                    <label for="username" class="block mb-1 font-medium">Username</label>
                    <input type="username" id="username" name="username" placeholder="Enter Your Username..."  class="w-full flex-grow p-1 border border-blue-300 rounded-md shadow-md">
                </div>

                <div>
                    <label for="password" class="block mb-1 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Your Password..."  class="w-full flex-grow p-1 border border-blue-300 rounded-md shadow-md">
                </div>

                <button type="submit" class="w-full bg-blue-500 text-white p-1 rounded-md hover:bg-blue-600">
                        Login
                    </button>
             </form>

        </div>
     </div>
     



    
</body>
</html>
